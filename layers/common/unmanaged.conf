# Paths under $HOME that this repo does not manage: tool state, caches, and
# session logs an app writes into a directory this repo also stows into.
# Not stowed -- lives outside home/ so stow never touches it, same convention
# as op-items.conf. One glob per line, matched against the path relative to
# $HOME. `*` crosses `/`, so keep patterns specific rather than broad (e.g.
# `.codex/*.sqlite*`, not `.codex/*`) or a genuinely new file nested under a
# tracked subdirectory gets hidden along with the noise.

# Claude Code runtime/session state
.claude/.last-cleanup
.claude/.settings.generated.json
.claude/backups
.claude/cache
.claude/daemon
.claude/daemon.lock
.claude/daemon.log
.claude/daemon.status.json
.claude/file-history
.claude/gh-pr-status-cache.json
.claude/history.jsonl
.claude/ide
.claude/jobs
.claude/paste-cache
.claude/plans
.claude/plugins
.claude/projects
.claude/security
.claude/session-env
.claude/sessions
.claude/settings.json
.claude/shell-snapshots
.claude/tasks
.claude/teams

# Codex runtime/session state
.codex/.codex-global-state.json
.codex/.codex-global-state.json.bak
.codex/.personality_migration
.codex/.tmp
.codex/auth.json
.codex/cache
.codex/computer-use
.codex/installation_id
.codex/ipc
.codex/memories
.codex/models_cache.json
.codex/pets
.codex/plugins
.codex/session_index.jsonl
.codex/sessions
.codex/shell_snapshots
.codex/sqlite
.codex/tmp
.codex/vendor_imports
.codex/*.sqlite*

# Generated skill views -- see bin/link-skills. Real directories full of
# symlinks, owned by the skill manager, not by any layer.
.codex/skills
.config/agents/skills
.config/goose/skills
.config/opencode/skills
.config/opencode/agents
.config/opencode/commands

# Tool caches and auth state
.config/gh/hosts.yml
.config/homebrew/trust.json
.config/homebrew/trust.json.lock
.config/op

# Never offer anything here for adopt -- .ssh holds private key material as
# well as housekeeping files (known_hosts, .DS_Store), and the two shouldn't
# even be distinguished by prompt. Public keys are pulled by `dot keys`
# (op-items.conf); config/allowed_signers/config.d are tracked directly.
.ssh/*
.claude/chrome
