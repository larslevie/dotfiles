# Which profile each machine gets. One "<hostname> <profile>" pair per line.
# Hostname is `scutil --get LocalHostName` (falls back to `hostname -s`).
# A machine may also have an optional layers/hosts/<hostname>/ overlay.
# machines.local.conf (untracked) takes the same format for hostnames that
# should stay out of the public repo, e.g. corporate asset tags.

Larss-Mac-mini	personal
Larss-Laptop	personal
